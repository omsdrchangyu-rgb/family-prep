<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>家庭防災庫</title>
<meta name="theme-color" content="#1C3D5A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="防災庫">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest?v=2">
<link rel="icon" href="icon-192.png?v=2">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:14px} img{max-width:100%} [hidden]{display:none!important}
</style>
<script src="config.js"></script>
</head>
<body>

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: phone column. Header + category rail → big "days" number → items (expiry row, rotation toggle, filters, cards) → log, schema.
   Palette: 防災手冊 — indigo ink + warning yellow. Expiry states use one warm ramp (red → orange → yellow) plus the ink-blue family, so every color belongs to the same set. */
:root{
  --bg:#F2F4F6; --surface:#FFFFFF; --surface-2:#F6F8FA; --ink:#13263A; --muted:#5C6977; --line:#D8DEE5;
  --accent:#1C3D5A; --accent-ink:#FFFFFF; --accent-soft:#E1E9F1;
  --signal:#F5B800; --signal-ink:#13263A; --wash:#EEF1F4; --hl:var(--signal);
  --t-exp:#C62E2E; --t-3:#D2630A; --t-6:#9E7700; --t-12:#3D6A97; --t-chk:#5B6B7E; --t-ok:#5C6977;
  --font-body:"Noto Sans TC",-apple-system,"PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --font-num:"Barlow Condensed","Noto Sans TC",-apple-system,system-ui,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1620; --surface:#16212D; --surface-2:#1C2936; --ink:#E6EBF0; --muted:#98A6B4; --line:#2A3846;
  --accent:#8DB4DA; --accent-ink:#0E1620; --accent-soft:#1E3348;
  --signal:#F5C431; --signal-ink:#13263A; --wash:#1F2B38; --hl:color-mix(in srgb,var(--signal) 38%,transparent);
  --t-exp:#F0766B; --t-3:#F29A50; --t-6:#F5C431; --t-12:#8DB4E8; --t-chk:#A7B4C4; --t-ok:#98A6B4; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1620; --surface:#16212D; --surface-2:#1C2936; --ink:#E6EBF0; --muted:#98A6B4; --line:#2A3846;
  --accent:#8DB4DA; --accent-ink:#0E1620; --accent-soft:#1E3348;
  --signal:#F5C431; --signal-ink:#13263A; --wash:#1F2B38; --hl:color-mix(in srgb,var(--signal) 38%,transparent);
  --t-exp:#F0766B; --t-3:#F29A50; --t-6:#F5C431; --t-12:#8DB4E8; --t-chk:#A7B4C4; --t-ok:#98A6B4; color-scheme:dark}

*{box-sizing:border-box}
html,body{overflow-x:clip;max-width:100%}
body{touch-action:pan-y pinch-zoom}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.label{font-size:12px;letter-spacing:.08em;color:var(--muted);margin:0}
svg.i{width:16px;height:16px;flex:0 0 auto}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;display:flex;flex-direction:column;gap:10px;
  margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:560px;margin:0 auto;width:100%}
.brand h1{margin:0;font-size:20px;font-weight:700;letter-spacing:.02em}
.brand small{display:block;color:var(--muted);font-size:12px}
.sync{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.pill{font-size:12px;padding:3px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
body.offline .pill{background:color-mix(in srgb,var(--signal) 30%,transparent);color:var(--ink)}
.switch{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.switch input{accent-color:var(--accent)}
.rail{display:flex;gap:6px;overflow-x:auto;max-width:560px;margin:0 auto;width:100%;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 14px;font-weight:700;font-size:15px;display:flex;align-items:baseline;gap:4px}
.rail button small{font-weight:400;font-size:11px;color:var(--muted)}
.rail .dot{min-width:18px;height:18px;border-radius:9px;background:var(--t-exp);color:#fff;font-size:11px;font-weight:700;display:inline-grid;place-items:center;padding:0 5px;align-self:center;font-family:var(--font-num)}
.item .qty small.short{color:var(--t-3)}
.att{list-style:none;margin:0;padding:0}
.att li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px;align-items:center}
.att li:first-child{border-top:0}
.att .why{font-size:12px;text-align:right}
.rail button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.offline-banner{display:none;max-width:560px;margin:0 auto;width:100%;font-size:13px;padding:8px 12px;border-radius:10px;
  background:color-mix(in srgb,var(--signal) 18%,var(--surface));border:1px solid color-mix(in srgb,var(--signal) 55%,transparent)}
body.offline .offline-banner{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.offline-banner .btn{flex:0 0 auto;background:var(--surface)}

/* days */
.days{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px}
.days-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tools{display:flex;gap:6px}
.mini{border:1px solid var(--line);background:var(--surface-2);border-radius:99px;height:30px;padding:0 10px;font-size:13px;display:inline-flex;align-items:center;gap:4px;color:var(--ink)}
.mini.icon{width:30px;padding:0;justify-content:center}
.mini svg{width:15px;height:15px}
.days .n{font-family:var(--font-num);font-size:68px;line-height:1;font-weight:700;align-self:flex-start;padding:0 8px 4px;display:inline-flex;align-items:baseline;
  background:linear-gradient(transparent 50%,var(--hl) 50%)}
.days .n span{font-size:22px;margin-left:6px;font-weight:600;font-family:var(--font-body);line-height:1}
.people{display:flex;flex-direction:column;gap:6px;border-top:1px dashed var(--line);padding-top:12px;min-width:0}
.days > *,.wrap > *{min-width:0}
.who{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;min-width:0}
.who::-webkit-scrollbar{display:none}
.who button{flex:1 1 0;min-width:3.4em;white-space:nowrap;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 10px;font-size:14px;text-align:center}
.days .big-cap{font-size:13px;color:var(--muted);margin-top:-6px}
.who button:hover{border-color:var(--accent)}

/* items section */
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sec-head h2{margin:0;font-size:17px;font-weight:700}
.sec-head small{color:var(--muted);font-size:12px}
.tiers{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.tier{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 2px;text-align:center;display:flex;flex-direction:column;gap:1px;align-items:center}
.tier .n{font-family:var(--font-num);font-size:22px;font-weight:700;line-height:1}
.tier .t{font-size:11px;color:var(--muted);white-space:nowrap}
.tier.on{border-color:currentColor;box-shadow:inset 0 0 0 1px currentColor;background:color-mix(in srgb,currentColor 8%,var(--surface))}
.tier.zero .n{color:var(--muted);opacity:.6}
.c-exp{color:var(--t-exp)} .c-3{color:var(--t-3)} .c-6{color:var(--t-6)} .c-12{color:var(--t-12)} .c-ok{color:var(--t-ok)} .c-chk{color:var(--t-chk)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:0 8px;border-radius:99px;border:1px solid currentColor;white-space:nowrap;line-height:1.7;
  background:color-mix(in srgb,currentColor 9%,transparent)}
.chip.c-chk{border-style:dashed}
.chip.c-ok{background:transparent;border-color:var(--line)}

.rot-toggle{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;text-align:left}
.rot-toggle b{font-size:15px}
.rot-toggle small{color:var(--muted);font-size:12px;margin-left:6px}
.rot-toggle .chev{transition:transform .2s}
.rot-toggle[aria-expanded="true"]{border-radius:12px 12px 0 0;border-bottom-color:transparent}
.rot-toggle[aria-expanded="true"] .chev{transform:rotate(180deg)}
.rot-panel{border:1px solid var(--line);border-top:0;background:var(--surface);border-radius:0 0 12px 12px;padding:0 14px 6px;margin-top:-1px}
.rot{list-style:none;margin:0;padding:0}
.rot li{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.rot li span:first-child{min-width:0}
.rot .q{font-family:var(--font-num);font-size:16px;color:var(--muted)}
.rot .d{min-width:5.5em;text-align:right;font-size:13px}
.rot .loc{color:var(--muted);font-size:12px}

.filters{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.filters::-webkit-scrollbar{display:none}
.filters button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 12px;font-size:13px}
.filters button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.items{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;width:100%}
.item:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.thumb{width:56px;height:56px;border-radius:10px;background:var(--accent-soft);display:grid;place-items:center;font-weight:700;color:var(--accent);overflow:hidden;font-size:20px}
.thumb img{width:100%;height:100%;object-fit:cover}
.item .body{min-width:0;display:flex;flex-direction:column;gap:5px;align-items:flex-start}
.item .name{font-weight:700;font-size:17px;line-height:1.3}
.item .loc{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:3px;max-width:100%}
.item .loc span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .loc svg{width:12px;height:12px}
.item .qty{text-align:right;font-family:var(--font-num);font-size:26px;font-weight:700;line-height:1}
.item .qty small{display:block;font-family:var(--font-body);font-size:11px;color:var(--muted);font-weight:400;margin-top:2px}
.item.expired .name{text-decoration:line-through;text-decoration-color:var(--t-exp)}
.empty{font-size:14px;color:var(--muted);padding:16px;text-align:center;border:1px dashed var(--line);border-radius:12px}

/* log + schema */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.log{list-style:none;margin:0;padding:0;font-size:13px;display:flex;flex-direction:column;gap:6px}
.log li{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding-top:6px}
.log li:first-child{border-top:0;padding-top:0}
.log .when{color:var(--muted);white-space:nowrap}
details.schema{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px}
details.schema summary{font-weight:700;cursor:pointer}
details.schema p{font-size:13px;color:var(--muted);margin:8px 0}
.tbl-wrap{overflow-x:auto;margin:6px 0 14px}
table{border-collapse:collapse;font-size:12.5px;min-width:100%}
th,td{border-bottom:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top;white-space:nowrap}
td:last-child{white-space:normal;min-width:12em;color:var(--muted)}
th{font-size:11px;letter-spacing:.06em;color:var(--muted);font-weight:500}
h3.sheet-name{font-size:14px;margin:12px 0 2px}
h3.sheet-name code{font-family:var(--font-num);font-size:13px;color:var(--muted);font-weight:500;margin-left:6px}
.future{color:var(--muted);font-weight:400;font-size:12px}
.foot{font-size:12px;color:var(--muted);text-align:center}

/* FAB */
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:6;
  background:var(--signal);color:var(--signal-ink);border:0;border-radius:99px;padding:12px 20px;font-weight:700;font-size:15px;box-shadow:0 6px 18px rgba(0,0,0,.18)}
body.offline .fab{display:none}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(10,18,28,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.scrim{padding:calc(44px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.sheet{position:relative;background:var(--surface);width:100%;max-width:560px;max-height:100%;overflow:auto;overflow-x:hidden;border-radius:20px;
  padding:16px 16px 20px;display:flex;flex-direction:column;gap:16px;box-shadow:0 12px 40px rgba(0,0,0,.25);overscroll-behavior:contain}
.sheet > *{min-width:0}
.sheet-x{position:sticky;top:-6px;align-self:flex-end;margin:-6px -6px -46px 0;z-index:3;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);
  background:var(--surface);color:var(--ink);font-size:18px;line-height:1;display:grid;place-items:center;flex:0 0 auto;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.sheet h2,.d-head{padding-right:44px}
.sheet h2{margin:0;font-size:19px}
.sheet .sub{font-size:13px;color:var(--muted);margin-top:-10px}
.btn{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:8px 14px;font-size:14px;color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn.icon{width:38px;padding:0;display:inline-grid;place-items:center}
.btn.icon svg{width:17px;height:17px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.danger{color:var(--t-exp);border-color:color-mix(in srgb,var(--t-exp) 40%,var(--line))}
.sheet-actions{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
.sheet-actions .right{display:flex;gap:8px;margin-left:auto}

/* detail card */
.d-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:start}
.d-title h2{font-size:24px;line-height:1.25;text-wrap:balance}
.d-title .loc{font-size:14px;color:var(--muted);margin-top:4px}
.d-qty{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:2px}
.d-qty .n{font-family:var(--font-num);font-size:32px;font-weight:700;line-height:1}
.d-qty .n small{font-family:var(--font-body);font-size:13px;font-weight:400;color:var(--muted);margin-left:3px}
.d-photos{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:12px;align-items:start}
.d-main{aspect-ratio:1;max-width:100%;border-radius:16px;background:var(--accent);display:grid;place-items:center;overflow:hidden;color:var(--accent-ink);font-size:40px;font-weight:700}
.d-main img{width:100%;height:100%;object-fit:cover}
.d-thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.d-thumbs button{aspect-ratio:1;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);overflow:hidden;padding:0}
.d-thumbs button.on{outline:2px solid var(--accent);outline-offset:1px}
.d-thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.hint{font-size:12px;color:var(--muted)}
.d-wash{background:var(--wash);border-radius:14px;padding:14px 16px;display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1.25fr);gap:14px}
.d-facts{display:flex;flex-direction:column;gap:9px;font-size:14px;margin:0}
.d-facts dt{font-size:11px;letter-spacing:.06em;color:var(--muted)}
.d-facts dd{margin:0;font-weight:500}
.d-facts dd .num{font-size:18px;font-weight:600}
.ratio-tag{display:inline-block;margin-top:3px;font-size:12px;font-weight:500;padding:1px 7px;border-radius:6px;background:color-mix(in srgb,var(--signal) 32%,transparent);color:var(--ink)}
.d-method{font-size:14px;line-height:1.65;border-left:1px solid var(--line);padding-left:14px}
.d-method .lab{font-size:11px;letter-spacing:.06em;color:var(--muted);display:block;margin-bottom:4px}
.d-dates{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.d-dates > div{display:flex;flex-direction:column;gap:2px}
.d-dates > div:last-child{text-align:right}
.d-dates .lab{font-size:11px;letter-spacing:.06em;color:var(--muted)}
.d-dates .val{font-family:var(--font-num);font-size:19px;font-weight:600}
.d-dates .rel{font-size:12px}

/* explain */
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:5.6em minmax(0,1fr) 3.8em;align-items:center;gap:10px;font-size:13px}
.bar .k small{display:block;color:var(--muted);font-size:11px;line-height:1.25}
.bar .track{height:10px;border-radius:5px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;position:relative}
.bar .fill{height:100%;background:var(--accent);border-radius:5px}
.bar.neck .fill{background:var(--signal)}
.bar .v{text-align:right;font-family:var(--font-num);font-size:17px;font-weight:600}
.target{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--t-exp)}
.notes{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:7px;margin:0;padding-left:18px}
.notes b{color:var(--ink);font-weight:600}
.warn{color:var(--t-3)}

/* member */
.m-days{display:flex;align-items:flex-end;gap:12px}
.m-days .n{font-family:var(--font-num);font-size:48px;line-height:1;font-weight:700;padding:0 6px 3px;display:inline-flex;align-items:baseline;background:linear-gradient(transparent 50%,var(--hl) 50%)}
.m-days .n span{font-size:18px;margin-left:4px;font-family:var(--font-body);line-height:1}
.m-days small{font-size:13px;color:var(--muted);padding-bottom:4px}
.gaps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px;font-size:14px}
.gaps li{display:flex;gap:8px;align-items:flex-start}
.gaps .dot{width:8px;height:8px;border-radius:50%;margin-top:7px;flex:0 0 8px;background:currentColor}
.gaps li span:last-child{color:var(--ink)}
.cat-block{display:flex;flex-direction:column;gap:2px}
.cat-block h3{margin:0 0 4px;font-size:14px;display:flex;justify-content:space-between;align-items:baseline}
.cat-block h3 small{font-weight:400;color:var(--muted);font-size:12px}
.alloc{list-style:none;margin:0;padding:0}
.alloc li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:14px;align-items:center}
.alloc li:first-child{border-top:0}
.alloc .nm{display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:0}

  function genInvImage(){
    const {title,secs}=invSections(ioState.id), n=secs.reduce((a,x)=>a+x.items.length,0);

    const hOf=r=>r.h?92:r.none?60:(flTxt(r.it)?104:76);
    const H=P+150+rows.reduce((a,r)=>a+hOf(r),0)+P+40;
    c.width=W; c.height=H;
    const draw=()=>{
      g.fillStyle='#FFFFFF'; g.fillRect(0,0,W,H);
      let y=P;
      g.fillStyle='#13263A'; g.font=`800 60px ${F}`; g.fillText(title,P,y+56);
      g.fillStyle='#5C6977'; g.font=`500 30px ${F}`; g.textAlign='right'; g.fillText(`${n} 項・${fmt(today)}`,W-P,y+52); g.textAlign='left';
      y+=84; g.fillStyle='#F5B800'; g.fillRect(P,y,W-2*P,8); y+=30;
      g.fillStyle='#5C6977'; g.font=`600 26px ${F}`; g.fillText('品名',P+64,y+10); g.textAlign='right'; g.fillText('應有',W-P-250,y+10); g.fillText('有效期限',W-P,y+10); g.textAlign='left'; y+=36;
      rows.forEach(r=>{const h=hOf(r);
        if(r.h){g.fillStyle='#1C3D5A'; g.font=`700 38px ${F}`; g.fillText(r.h,P,y+64);}
        else if(r.none){g.fillStyle='#98A6B4'; g.font=`500 30px ${F}`; g.fillText('沒有品項',P+64,y+42);}
        else{const it=r.it, bad=it.exp&&['exp','3'].includes(tierOf(it));
          g.strokeStyle='#13263A'; g.lineWidth=4; g.strokeRect(P+4,y+22,36,36);
          g.fillStyle='#13263A'; g.font=`600 36px ${F}`; let nm=it.name; while(g.measureText(nm).width>W-2*P-64-420&&nm.length>2)nm=nm.slice(0,-2)+'…'; g.fillText(nm,P+64,y+52);
          if(flTxt(it)){g.fillStyle='#5C6977'; g.font=`500 26px ${F}`; let t=flTxt(it); while(g.measureText(t).width>W-2*P-64-420&&t.length>2)t=t.slice(0,-2)+'…'; g.fillText(t,P+64,y+88);}
          g.textAlign='right'; g.fillStyle='#13263A'; g.font=`700 40px ${N}`; g.fillText(`${it.qty}`,W-P-290,y+54); g.font=`500 28px ${F}`; g.fillText(it.unit,W-P-250,y+52);
          g.fillStyle=bad?'#C62E2E':'#13263A'; g.font=`${bad?700:500} 32px ${N}`; g.fillText(it.exp||'—',W-P,y+52); g.textAlign='left';
          g.fillStyle='#E1E6EB'; g.fillRect(P,y+h-2,W-2*P,2);}
        y+=h;});
      g.fillStyle='#98A6B4'; g.font=`500 24px ${F}`; g.fillText('家庭防災庫・盤點清單',P,H-P+10);
    };
    (async()=>{try{await document.fonts.ready;}catch(e){} draw();
      const out=document.getElementById('wallOut'); if(!out)return;
      c.toBlob(blob=>{if(!blob){toast('產生失敗');return;}
        const url=URL.createObjectURL(blob), file=new File([blob],`盤點-${title}.png`,{type:'image/png'});
        const canShare=!!(navigator.canShare&&navigator.canShare({files:[file]}));

        out._file=file; out.scrollIntoView({behavior:'smooth',block:'nearest'});
      },'image/png');})();
  }

  async function photoData(p){
    if(!p)return ''; if(p.startsWith('data:'))return p; if(fullCache[p])return fullCache[p];
    try{let d=await idb.get('full_'+p).catch(()=>null); if(!d&&S.online&&!DEMO){d=(await api('photo',{id:p})).data;} if(d){fullCache[p]=d; return d;}}catch(e){}
    return '';
  }
  function cropImage(src,ratio,title,allowSkip){return new Promise(resolve=>{
    const img=new Image();
    img.onerror=()=>resolve(null);
    img.onload=()=>{
      let srcC=document.createElement('canvas'); srcC.width=img.width; srcC.height=img.height; srcC.getContext('2d').drawImage(img,0,0);
      const SW=Math.min(300,window.innerWidth-64), SH=Math.round(SW/ratio), dpr=window.devicePixelRatio||1;
      const ov=document.createElement('div'); ov.className='crop';
      ov.innerHTML=`<div class="crop-box" role="dialog" aria-label="裁切照片"><h3>${esc(title||'裁切照片')}</h3><div class="crop-stage" style="width:${SW}px;height:${SH}px"><canvas width="${SW*dpr}" height="${SH*dpr}" style="width:${SW}px;height:${SH}px"></canvas></div>
        <input type="range" class="crop-zoom" min="1" max="4" step="0.01" value="1" aria-label="縮放">
        <div class="hint">拖曳移動，雙指或拉桿縮放</div>
        <div class="crop-acts"><button class="btn" data-c="cancel">${allowSkip?'不裁切':'取消'}</button><button class="btn" data-c="rot">↻ 旋轉</button><button class="btn primary" data-c="ok">完成</button></div></div>`;
      document.body.appendChild(ov);
      const cv=ov.querySelector('canvas'), g=cv.getContext('2d'), zr=ov.querySelector('.crop-zoom'), stage=ov.querySelector('.crop-stage');
      let z=1, cx=SW/2, cy=SH/2;
      const base=()=>Math.max(SW/srcC.width,SH/srcC.height);
      const clamp=()=>{const k=base()*z, w=srcC.width*k, h=srcC.height*k; cx=Math.min(w/2,Math.max(SW-w/2,cx)); cy=Math.min(h/2,Math.max(SH-h/2,cy));};
      const paint=(ctx,f)=>{const k=base()*z*f, w=srcC.width*k, h=srcC.height*k; ctx.imageSmoothingQuality='high'; ctx.drawImage(srcC,cx*f-w/2,cy*f-h/2,w,h);};
      const draw=()=>{clamp(); g.setTransform(1,0,0,1,0,0); g.fillStyle='#000'; g.fillRect(0,0,cv.width,cv.height); paint(g,dpr);};
      const setZ=(nz,px=SW/2,py=SH/2)=>{nz=Math.min(4,Math.max(1,nz)); cx=px-(px-cx)*nz/z; cy=py-(py-cy)*nz/z; z=nz; zr.value=z; draw();};
      draw();
      const pts=new Map(); let last=null;
      const pos=e=>{const r=stage.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top};};
      stage.addEventListener('pointerdown',e=>{stage.setPointerCapture(e.pointerId); pts.set(e.pointerId,pos(e)); last=null;});
      stage.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return; const p=pos(e), prev=pts.get(e.pointerId); pts.set(e.pointerId,p);
        if(pts.size===1){cx+=p.x-prev.x; cy+=p.y-prev.y; draw();}
        else if(pts.size===2){const [a,b]=[...pts.values()], d=Math.hypot(a.x-b.x,a.y-b.y), m={x:(a.x+b.x)/2,y:(a.y+b.y)/2}; if(last){setZ(z*d/last.d,m.x,m.y); cx+=m.x-last.m.x; cy+=m.y-last.m.y; draw();} last={d,m};}});
      const up=e=>{pts.delete(e.pointerId); last=null;};
      stage.addEventListener('pointerup',up); stage.addEventListener('pointercancel',up);
      stage.addEventListener('wheel',e=>{e.preventDefault(); const p=pos(e); setZ(z*(e.deltaY<0?1.08:1/1.08),p.x,p.y);},{passive:false});
      zr.addEventListener('input',()=>setZ(Number(zr.value)));
      const finish=v=>{ov.remove(); resolve(v);};
      ov.addEventListener('click',e=>{const b=e.target.closest('[data-c]'); if(!b)return; e.stopPropagation();
        if(b.dataset.c==='cancel')finish(null);
        if(b.dataset.c==='rot'){const r=document.createElement('canvas'); r.width=srcC.height; r.height=srcC.width; const rg=r.getContext('2d'); rg.translate(r.width,0); rg.rotate(Math.PI/2); rg.drawImage(srcC,0,0); srcC=r; z=1; zr.value=1; cx=SW/2; cy=SH/2; draw();}
        if(b.dataset.c==='ok'){
          const OW=ratio>=1?1200:960, OH=Math.round(OW/ratio), f=OW/SW;
          const o=document.createElement('canvas'); o.width=OW; o.height=OH; const og=o.getContext('2d'); og.fillStyle='#fff'; og.fillRect(0,0,OW,OH); paint(og,f);
          const t=document.createElement('canvas'), TW=240, TH=Math.round(TW/ratio); t.width=TW; t.height=TH; const tg=t.getContext('2d'); tg.imageSmoothingQuality='high'; tg.drawImage(o,0,0,TW,TH);
          finish({full:o.toDataURL('image/jpeg',.85),thumb:t.toDataURL('image/jpeg',.72)});
        }});
    };
    img.src=src;
  });}

    if(S.cat!=='食'){
      const list=inCat(S.cat).map(it=>({it,why:attention(it)})).filter(x=>x.why.length);
      openSheet(`<h2>${CFG[S.cat].title}：${list.length} 項要處理</h2>
        <div class="sub">列出已過期、3 個月內到期、超過 6 個月沒檢查、電量低於 50%，以及全家共用但不夠分的品項。</div>
        ${list.length?`<ul class="att">${list.map(({it,why})=>`<li><span>${esc(it.name)}<span style="color:var(--muted);font-size:12px">・${esc(locLabel(it.loc))}</span></span><span class="why c-3">${why.map(esc).join('・')}</span></li>`).join('')}</ul>`:'<div class="empty">全部就緒</div>'}
        <ul class="notes"><li>「不夠分」依品項設定的需求計算：每人需要幾個，或每人每天用幾個（可用天數低於避難包目標 ${S.goBag} 天就提醒）。</li></ul>
        <div class="sheet-actions"><span></span><button class="btn primary" data-act="close">知道了</button></div>`,'要處理的品項');
      return;
    }
    const c=calc(S.items,S.members);
    const max=Math.max(c.days.meals,c.days.kcal,c.days.water,1)*1.1;
    const expCount=S.items.filter(it=>isFood(it)&&!active(it)).length;
    const groupWarn=c.groupDays.filter(g=>g.days<c.min).map(g=>`<li class="warn">${g.c}（${g.names.join('、')}）能吃的份量只夠 <b class="num">${r1(g.days)}</b> 天</li>`).join('');
    openSheet(`<h2>可撐 ${r1(c.min)} 天怎麼算</h2><div class="sub">餐數、熱量、飲用水各算一次，取最短的。這次的瓶頸是<b style="color:var(--ink)">${NECK[c.neck]}</b>（黃色）。</div>
      <div class="bars">
        ${barRow('餐數',`${c.servings} 份 ÷ ${c.dMeals} 份/日`,c.days.meals,max,c.neck==='meals')}
        ${barRow('熱量',`${Math.round(c.kcal).toLocaleString()} ÷ ${c.dKcal.toLocaleString()} kcal`,c.days.kcal,max,c.neck==='kcal')}
        ${barRow('飲用水',`${r1(c.drink)} L ÷ ${r1(c.dWater)} L/日`,c.days.water,max,c.neck==='water')}
      </div>
      <ul class="notes">
        <li>每人每日飲用水已包含沖泡食品吃進去的水。目前沖泡平均每天用 <b class="num">${r1(c.dPrep)}</b> L，在 <b class="num">${r1(c.dDrink)}</b> L 之內，不另外加。</li>
        <li>生活用水另計：存量 <b class="num">${r1(c.hygStock)}</b> L，每天 ${r1(c.dHyg)} L，可撐 <b class="num">${r1(c.hygDays)}</b> 天。</li>
        <li>底線：生活用水用完、飲用水也要拿來洗手刷牙時，飲用水只剩 <b class="num">${r1(c.worst)}</b> 天。</li>
        ${groupWarn}
        ${expCount?`<li>已過期的 ${expCount} 項食品不列入計算。</li>`:''}
        <li>每人每日飲水、餐數、熱量可以從右上的調整鈕修改。</li>
      </ul>
      <div class="sheet-actions"><span></span><button class="btn primary" data-act="close">知道了</button></div>`,'計算方式');
  }

  function allocRow(it,shared){
    const q=isWater(it)?`${r1(it.qty*it.unitL)}<small>L</small>`:`${it.qty}<small>${esc(it.unit)}</small>`;
    const flag=['exp','3','chk'].includes(tierOf(it))?tierChip(it):'';
    return `<li><span class="nm">${esc(it.name)}${shared?'<span class="shared">共用</span>':''}${flag}</span><span class="q">${q}</span></li>`;
  }
  function openMember(id){
    const m=mem(id), c0=cat(m);
    const fits=it=>!it.suits||!it.suits.length||isWater(it)||it.suits.includes(c0);
    const own=S.items.filter(it=>it.owner===m.id);
    const c=calc(own,[m]);
    const gaps=[];
    if(!own.some(it=>it.cat==='食'&&it.sub==='飲用水'&&active(it)))gaps.push(['c-exp','避難包裡沒有飲用水']);
    else if(c.days.water<S.goBag)gaps.push(['c-3',`飲用水只夠 ${r1(c.days.water)} 天`]);
    if(!own.some(it=>isFood(it)&&active(it)))gaps.push(['c-exp','避難包裡沒有食物']);
    else if(c.days.kcal<S.goBag)gaps.push(['c-3',`熱量只夠 ${r1(c.days.kcal)} 天`]);
    own.filter(it=>it.suits&&it.suits.length&&!isWater(it)&&!it.suits.includes(c0)).forEach(it=>gaps.push(['c-6',`「${it.name}」不適合${c0}`]));
    const needPrep=own.filter(it=>isFood(it)&&it.prep>0&&active(it));
    if(needPrep.length&&!own.some(it=>it.cat==='食'&&it.sub==='飲用水'))gaps.push(['c-3',`${needPrep.map(i=>i.name).join('、')}要沖泡，包裡卻沒有水`]);
    if(!own.some(it=>it.cat==='衣'))gaps.push(['c-6','沒有個人衣物']);
    const blocks=CATS.map(k=>{
      const o=own.filter(it=>it.cat===k), sh=S.items.filter(it=>it.cat===k&&it.owner==='all'&&fits(it));
      return `<div class="cat-block"><h3>${k}<small>個人 ${o.length}・共用 ${sh.length}</small></h3>
        ${o.length||sh.length?`<ul class="alloc">${o.map(it=>allocRow(it,false)).join('')}${sh.map(it=>allocRow(it,true)).join('')}</ul>`:'<div class="cat-empty">沒有分配到的品項</div>'}</div>`;
    }).join('');
    openSheet(`<h2>${esc(m.name)}</h2><div class="sub">${c0}・${ageTxt(m)}・每天 ${m.water} L 水、${m.meals} 餐、${m.kcal} kcal</div>
      <div class="m-days"><div class="n">${r1(c.min)}<span>天</span></div><small>個人避難包的食物與水可撐（目標 ${S.goBag} 天，不含共用）</small></div>
      ${gaps.length?`<ul class="gaps">${gaps.map(([cl,t])=>`<li class="${cl}"><span class="dot"></span><span>${esc(t)}</span></li>`).join('')}</ul>`:''}
      ${blocks}
      <div class="sheet-actions"><span></span><button class="btn primary" data-act="close">關閉</button></div>`,m.name+'的資源');
  }

  function needText(it){
    const cov=coverage(it);
    if(cov)return cov.long;
    if(it.needType&&it.need&&it.owner!=='all')return it.needType==='each'?`每人 ${it.need} ${it.unit}`:`每人每天 ${it.need} ${it.unit}`;
    return null;
  }
  const hasFl=it=>Array.isArray(it.flavors)&&it.flavors.length>0;
  const flSum=fl=>fl.reduce((a,x)=>a+(Number(x.q)||0),0);
  function factsFor(it){
    const row=(k,v)=>`<div><dt>${k}</dt><dd>${v}</dd></div>`;
    if(isFood(it)){const r=kcalPer100(it);
      return (hasFl(it)?row('口味',`<span class="fl-list">${it.flavors.map(x=>`<span class="fl-chip ${x.q?'':'out'}">${esc(x.n)}<b>${x.q}</b></span>`).join('')}</span>`):'')+row('適合對象',it.suits.join('、')||'—')+row('每份熱量',`<span class="num">${it.kcal}</span> kcal`)+
        row('沖泡水',it.prep?`<span class="num">${it.prep}</span> ml${r!=null?`<br><span class="ratio-tag">每 100 ml 水換 ${r} kcal</span>`:''}`:'不需要');}
    if(isWater(it))return row('每單位容量',`<span class="num">${it.unitL}</span> L × ${it.qty} ${esc(it.unit)}`)+row('用途',it.sub==='飲用水'?'飲用、沖泡':'洗手、刷牙、擦澡');
    let h=row('子類',esc(it.sub));
    if(it.size)h+=row('尺寸',`<span class="num">${esc(it.size)}</span>`);
    if(it.suits&&it.suits.length)h+=row('適合對象',it.suits.join('、'));
    if(it.mah)h+=row('容量',`<span class="num">${it.mah.toLocaleString()}</span> mAh`);
    if(it.battery!=null&&it.battery!=='')h+=row('電量',`<span class="num ${lowBattery(it)?'c-chk':''}">${it.battery}</span> %`);
    const pc=phoneCharges(it); if(pc!=null)h+=row('約可充手機',`<span class="num">${pc}</span> 次<br><span class="ratio-tag">以每次約 15 Wh 估算</span>`);
    const nt=needText(it); if(nt)h+=row('需求',esc(nt));
    return h;
  }

  let photoIdx=0;
  function openItem(id,keepIdx){
    const it=S.items.find(x=>x.id===id); if(!it)return;
    if(!keepIdx)photoIdx=0;
    if(photoIdx>=it.photos.length)photoIdx=0;
    const ro=S.offline;
    const owner=it.owner==='all'?'全家共用':`${mem(it.owner).name}的`;
    const qty=isWater(it)?`${r1(it.qty*it.unitL)}<small>L</small>`:`${it.qty}<small>${esc(it.unit)}</small>`;
    const main=it.photos[photoIdx];
    const side=it.photos.length>1
      ?`<div class="d-thumbs">${it.photos.map((p,i)=>`<button data-act="ph" data-id="${it.id}" data-i="${i}" class="${i===photoIdx?'on':''}" aria-label="第 ${i+1} 張照片"><img src="${psrc(p)}" alt=""></button>`).join('')}</div>`
      :`<div class="hint">${it.photos.length?'只有 1 張照片。':'還沒有照片。'}${ro?'':'在編輯裡可以加照片、選列表縮圖。'}</div>`;
    const d=it.exp?daysTo(it.exp):null, [,cls]=TIER[tierOf(it)];
    const chkDays=-daysTo(it.checked);
    const chkLab=it.battery!=null&&it.battery!==''?'上次充電':'最後檢查日';
    openSheet(`
      <div class="d-head">
        <div class="d-title"><h2>${esc(it.name)}</h2><div class="loc">${esc(locLabel(it.loc))}・${esc(owner)}</div></div>
        <div class="d-qty"><div class="n">${qty}</div>${tierChip(it)}</div>
      </div>
      <div class="d-photos">
        <div class="d-main">${main?`<img src="${pfull(main)}" data-pid="${esc(main)}" alt="${esc(it.name)}">`:esc(it.name.slice(0,1))}</div>
        ${side}
      </div>
      <div class="d-wash">
        <dl class="d-facts">${factsFor(it)}</dl>
        <div class="d-method"><span class="lab">${CFG[it.cat].methodLab}</span>${it.method?esc(it.method):'<span style="color:var(--muted)">尚未填寫</span>'}</div>
      </div>
      <div class="d-dates">
        <div><span class="lab">${chkLab}</span><span class="val">${it.checked}</span><span class="rel ${tierOf(it)==='chk'?'c-chk':''}" style="${tierOf(it)==='chk'?'':'color:var(--muted)'}">${chkDays===0?'今天':chkDays+' 天前'}</span></div>
        <div><span class="lab">有效日</span><span class="val">${it.exp||'—'}</span><span class="rel ${it.exp?cls:''}" style="${it.exp?'':'color:var(--muted)'}">${it.exp?(d<0?`已過期 ${-d} 天`:`剩 ${d} 天`):'依檢查日提醒'}</span></div>
      </div>
      <div class="sheet-actions">
        ${S.ret?`<button class="btn" data-act="scen" data-id="${S.ret}">← 返回情境</button>`:'<button class="btn" data-act="close">關閉</button>'}
        <div class="right">
          <button class="btn icon" data-act="edit" data-id="${it.id}" aria-label="編輯品項" ${ro?'disabled':''}>${ICON.pencil}</button>
          <button class="btn" data-act="checked" data-id="${it.id}" ${ro?'disabled':''}>${it.battery!=null&&it.battery!==''?'已充電':'已檢查'}</button>
          <button class="btn primary" data-act="consume" data-id="${it.id}" ${ro||!it.qty?'disabled':''}>紀錄消耗</button>
        </div>
      </div>`,it.name);
  }

  let cState=null;
  function drawConsume(){
    const it=S.items.find(x=>x.id===cState.id);
    if(hasFl(it)&&(cState.fl==null||!it.flavors[cState.fl]||!it.flavors[cState.fl].q)){const i=it.flavors.findIndex(x=>x.q>0); cState.fl=i<0?0:i; cState.n=1;}
    openSheet(`<h2>紀錄消耗</h2><div class="sub">${esc(it.name)}・目前 ${it.qty} ${esc(it.unit)}</div>
      ${hasFl(it)?`<div class="field"><span>哪個口味</span><div class="toggles">${it.flavors.map((x,i)=>`<button data-act="cfl" data-i="${i}" class="${cState.fl===i?'on':''}" ${x.q?'':'disabled'}>${esc(x.n)} ${x.q}</button>`).join('')}</div></div>`:''}
      <div class="stepper" style="align-self:center"><button data-act="cn" data-d="-1" aria-label="減少">−</button><output>${cState.n} ${esc(it.unit)}</output><button data-act="cn" data-d="1" aria-label="增加">＋</button></div>
      <div class="sheet-actions"><button class="btn" data-act="back" data-id="${it.id}">返回</button><button class="btn primary" data-act="cok">扣除 ${cState.n} ${esc(it.unit)}</button></div>`,'紀錄消耗');
  }

  let fState=null;
  function openForm(id,preset){
    const it=id?S.items.find(x=>x.id===id):null;
    const c=preset?preset.cat:S.cat, sub=CFG[c].subs[0];
    fState=it?JSON.parse(JSON.stringify(it)):{id:null,cat:c,sub,name:'',method:'',kcal:'',prep:0,qty:1,unit:c==='食'?'包':'個',unitL:'',exp:c==='食'||c==='醫藥'?addDays(365):'',suits:c==='食'?['成人','兒童']:[],owner:'all',loc:'',checked:fmt(today),photos:[],needType:'',need:'',size:'',mah:'',battery:'',flavors:[]};
    if(preset&&!it)Object.assign(fState,{name:preset.name,qty:preset.qty,unit:preset.unit,fromWant:preset.fromWant});
    drawForm(false);
  }
  function drawForm(keep=true){
    const f=fState, cfg=CFG[f.cat], food=f.cat==='食', water=food&&(f.sub==='飲用水'||f.sub==='生活用水');
    const r=food&&!water&&Number(f.prep)>0&&Number(f.kcal)>0?Math.round(f.kcal/f.prep*100):null;
    const expOptional=!cfg.expReq||f.sub==='生活用水';
    const inp=(k,lab,type,extra='')=>`<label class="field"><span>${lab}</span><input id="f-${k}" data-f="${k}" ${type?`type="${type}"`:''} value="${esc(f[k]??'')}" ${extra}></label>`;
    openSheet(`<h2>${f.id?'編輯品項':f.fromWant?'買到了：補上資料':'新增品項'}</h2><div class="sub">大類：${f.cat}${f.fromWant?'・填好有效日與存放位置後移進庫存':''}</div>
      <div class="field"><span>照片（點一張設為列表縮圖）</span>
        <div class="f-photos">${f.photos.map((p,i)=>`<div class="f-photo ${i===0?'cover':''}"><button class="pick" data-act="fcover" data-i="${i}" aria-label="設為縮圖"><img src="${psrc(p)}" alt=""></button>${i===0?'<span class="badge">縮圖</span>':''}<button class="rm" data-act="frm" data-i="${i}" aria-label="移除照片">✕</button><button class="crp" data-act="fcrop" data-i="${i}" aria-label="裁切這張照片">✂</button></div>`).join('')}
          <label class="f-add" for="f-files">＋<br>加照片<input type="file" id="f-files" accept="image/*" multiple data-fphoto="1"></label></div></div>
      <div class="grid2">
        <label class="field"><span>子類</span><select id="f-sub" data-f="sub">${cfg.subs.map(s=>`<option ${f.sub===s?'selected':''}>${s}</option>`).join('')}</select></label>
        ${inp('name','名稱','','placeholder="例：'+(food?'乾燥米飯':'頭燈')+'"')}
        ${food&&!water&&f.flavors&&f.flavors.length?`<label class="field"><span>數量（口味加總）</span><input id="f-qty" value="${flSum(f.flavors)}" disabled></label>`:inp('qty','數量','number','inputmode="numeric" min="0"')}
        ${inp('unit','單位','','placeholder="包、個、件"')}
        ${water?inp('unitL','每單位容量 L','number','step="0.1" inputmode="decimal"'):''}
        ${food&&!water?inp('kcal','每份熱量 kcal','number','inputmode="numeric"')+inp('prep','每份沖泡水 ml','number','inputmode="numeric"'):''}
        ${f.cat==='衣'?inp('size','尺寸','','placeholder="L、130、90"'):''}
        ${f.cat==='生存'?inp('mah','容量 mAh（電力類）','number','inputmode="numeric"')+inp('battery','目前電量 %','number','inputmode="numeric" min="0" max="100"'):''}
        <label class="field"><span>有效日${expOptional?'（可空白）':''}</span><input id="f-exp" data-f="exp" type="date" value="${f.exp||''}"></label>
      </div>
      ${food&&!water?`<div class="hint" id="f-ratio" ${r==null?'hidden':''}>${r!=null?`每 100 ml 水換 ${r} kcal`:''}</div>
      <div class="field"><span>口味（選填）・同一種東西不同口味記在一起，數量自動加總</span>
        ${(f.flavors||[]).length?`<ul class="fl-edit">${f.flavors.map((x,i)=>`<li><input id="fl-n-${i}" data-fl="${i}" data-k="n" value="${esc(x.n)}" placeholder="口味" aria-label="口味名稱"><input id="fl-q-${i}" data-fl="${i}" data-k="q" type="number" inputmode="numeric" min="0" value="${esc(x.q)}" aria-label="數量"><button class="btn sm icon danger" data-act="fldel" data-i="${i}" aria-label="移除這個口味">✕</button></li>`).join('')}</ul>`:''}
        <div class="toggles"><button data-act="fladd">＋ 加口味</button></div></div>`:''}
      <label class="field"><span>${cfg.methodLab}</span><textarea id="f-method" data-f="method" rows="2">${esc(f.method)}</textarea></label>
      ${(food&&!water)||cfg.suits?`<div class="field"><span>適合對象（可複選）</span><div class="toggles">${['成人','兒童','幼兒'].map(s=>`<button data-act="fs" data-k="${s}" class="${f.suits.includes(s)?'on':''}">${s}</button>`).join('')}</div></div>`:''}
      ${food?'':`<div class="field"><span>需求（全家共用時用來判斷夠不夠分）</span>
        <div class="toggles">${[['','不計算'],['each','每人幾個'],['daily','每人每天幾個']].map(([k,l])=>`<button data-act="fn" data-k="${k}" class="${(f.needType||'')===k?'on':''}">${l}</button>`).join('')}</div>
        ${f.needType?`<input id="f-need" data-f="need" type="number" step="0.1" inputmode="decimal" value="${esc(f.need)}" placeholder="數量" style="margin-top:6px">`:''}</div>`}
      <div class="grid2">
        <label class="field"><span>歸屬</span><select id="f-owner" data-f="owner"><option value="all" ${f.owner==='all'?'selected':''}>全家共用</option>${S.members.map(m=>`<option value="${m.id}" ${f.owner===m.id?'selected':''}>${esc(m.name)}</option>`).join('')}</select></label>
        <label class="field"><span>存放位置</span><select id="f-loc" data-f="loc">${locOptions(f.loc)}</select></label>
      </div>
      <div class="sheet-actions">${f.id?`<button class="btn danger" data-act="fdel">${f.delArm?'再按一次確認刪除':'刪除品項'}</button>`:''}<div class="right"><button class="btn" data-act="${f.id?'back':'close'}" data-id="${f.id||''}">取消</button><button class="btn primary" data-act="fok">${f.id?'儲存':f.fromWant?'移進庫存':'新增'}</button></div></div>`,f.id?'編輯品項':f.fromWant?'買到了：補上資料':'新增品項',keep);
  }

  function openSettings(){
    const step=(id,k,v,unit,d)=>`<div><span>${unit}</span><div class="stepper"><button data-act="ms" data-id="${id}" data-k="${k}" data-d="${-d}" aria-label="減少">−</button><output>${v}</output><button data-act="ms" data-id="${id}" data-k="${k}" data-d="${d}" aria-label="增加">＋</button></div></div>`;
    openSheet(`<h2>每人每日需求</h2><div class="sub">改完立刻重算可撐天數。飲用水已包含沖泡食品的水。</div>
      ${S.members.map(m=>`<div class="mrow"><div class="h"><b>${esc(m.name)}</b><span style="font-size:12px;color:var(--muted)">${cat(m)}・${ageTxt(m)}</span></div>
        <div class="ctrls">${step(m.id,'water',m.water,'飲用水 L',0.5)}${step(m.id,'meals',m.meals,'餐數',1)}${step(m.id,'kcal',m.kcal,'熱量 kcal',50)}</div></div>`).join('')}
      <div class="mrow"><div class="h"><b>全家共通</b></div><div class="ctrls">${step('_','hyg',S.hyg,'生活用水 L/人/日',0.5)}${step('_','goBag',S.goBag,'避難包目標天數',1)}</div></div>
      <div class="sheet-actions"><span></span><button class="btn primary" data-act="close">完成</button></div>`,'每人每日需求');
  }

  // ================= wishlist =================
  function wantNames(){return new Set(S.wants.map(w=>w.name));}
  let suggCache=[];
  function suggestions(){
    const have=wantNames(), seen=new Set(), out=[];
    const push=o=>{if(have.has(o.name)||seen.has(o.name))return; seen.add(o.name); out.push(o);};
    S.items.forEach(it=>{
      const cov=coverage(it), n=S.members.length;
      if(cov&&cov.short){
        const q=it.needType==='each'?Math.max(1,Math.ceil(it.need*n-it.qty)):Math.max(1,Math.ceil(it.need*n*S.goBag-it.qty));

    if(sp.t==='lib'&&LIB[sp.k])return sp.l&&sp.l!==labOf(LIB[sp.k])?{...LIB[sp.k],label:sp.l}:LIB[sp.k];

      if(r.title)sc.title=r.title; if(r.sum!=null&&r.title)sc.sum=r.sum; if(r.group)sc.g=r.group;
      if(r.needs){try{sc.needs=JSON.parse(r.needs).map(needFromSpec);}catch(e){}}
      sc.edited=true;
    });
    S.scenHidden=new Set(hidden);
    SCEN=SCEN.filter(sc=>!S.scenHidden.has(sc.id));
    if(order.length){const pos=id=>{const i=order.indexOf(id);return i<0?1e6:i;}; const base=SCEN.map(s=>s.id); SCEN.sort((a,b)=>pos(a.id)-pos(b.id)||base.indexOf(a.id)-base.indexOf(b.id));}
  }

    const wrap=(t,max)=>{const out=[]; let line=''; for(const ch of t){if(g.measureText(line+ch).width>max&&line){out.push(line); line=ch;} else line+=ch;} if(line)out.push(line); return out;};

    g.fillStyle=d.blood?'#FFFFFF':'#5C6977'; g.textAlign='center'; g.font=`600 30px ${F}`; g.fillText('血型',bx+85,by+52);
    const bs=fit(d.blood||'?',150,96,'700',N); g.font=`700 ${bs}px ${N}`; g.fillText(d.blood||'?',bx+85,by+150); g.textAlign='left';

    {const has=!!d.allergy; y+=24; g.font=`700 40px ${F}`; const lines=wrap('過敏：'+(d.allergy||'無'),CW-152); const h=lines.length*54+36; rr(cx,y,CW-112,h,20); g.fillStyle=has?'#FCE9E9':'#EEF1F4'; g.fill(); g.fillStyle=has?'#C62E2E':'#5C6977'; lines.forEach((l,i)=>g.fillText(l,cx+24,y+58+i*54)); y+=h;}

    if(d.others.length){section('緊急聯絡人'); d.others.slice(0,Math.max(1,9-Math.min(7,d.fam.length))).forEach(person);}
    if(d.meet.length){section('約定集合點');
      g.font=`600 34px ${F}`; const LW=Math.max(...d.meet.map(r=>g.measureText(r.k).width))+28;

    g.fillStyle='#98A6B4'; g.font=`500 30px ${F}`; g.textAlign='center'; g.fillText('撿到這支手機，請聯絡上面的家人',W/2,2400); g.textAlign='left';

  async function openWallpapers(){
    openSheet(`<h2>手機桌布</h2><div class="sub">選一位家人產生桌布。存到照片後，到「設定 → 背景圖片」設為鎖定畫面。</div>

  // ---- printable cards ----
  const meetLi=r=>`<li class="${r.sub?'msub':''}"><span>${esc(r.k)}</span><b>${esc(r.v)}</b></li>`;

  function ccFront(d){return `<div class="pc front"><div class="pc-top"><span>ICE 緊急聯絡卡</span><span class="pc-bt ${d.blood?'':'none'}">${esc(d.blood||'?')}<small>血型</small></span></div>

  let pState=null;

  // cards keep their real mm size; the whole page is zoomed to fit the phone screen
  // (transform instead of zoom: Safari measures zoomed boxes inconsistently)
  function scalePreview(pv){
    pv.querySelectorAll('.pwrap').forEach(w=>{w.style.width='0px';});
    const avail=pv.clientWidth-22;
    pv.querySelectorAll('.ppage').forEach(pg=>{
      let wr=pg.parentElement; if(!wr.classList.contains('pwrap')){wr=document.createElement('div'); wr.className='pwrap'; pg.before(wr); wr.appendChild(pg);}
      pg.style.transform=''; const w=pg.offsetWidth, h=pg.offsetHeight, k=Math.min(1,avail/w);
      pg.style.transform=`scale(${k})`; wr.style.width=(w*k)+'px'; wr.style.height=(h*k)+'px';});
  }
  function fitPreview(){const pv=document.getElementById('pprev'); if(!pv)return; fitCards(pv); scalePreview(pv);}
  // shrink text until each card's content fits its fixed size (long names, many contacts)
  function fitCards(rootEl){
    rootEl.querySelectorAll('.a6-in,.pc').forEach(el=>{
      el.style.fontSize='';
      let fs=parseFloat(getComputedStyle(el).fontSize), n=0;
      el.querySelectorAll('.pc-id > div').forEach(x=>x.style.fontSize='');
      // the name/ID block next to the photo shrinks on its own, so a long name doesn't shrink the whole card
      const fitId=()=>el.querySelectorAll('.pc-id > div').forEach(x=>{x.style.fontSize=''; let f=parseFloat(getComputedStyle(x).fontSize), i=0; while(x.scrollWidth>x.clientWidth+1&&i<20){f*=0.94; x.style.fontSize=f+'px'; i++;}});
      fitId();
      while(el.scrollHeight>el.clientHeight+1&&n<30){fs*=0.95; el.style.fontSize=fs+'px'; fitId(); n++;}
    });
  }
  function doPrint(){
    let el=document.getElementById('printArea'); if(!el){el=document.createElement('div'); el.id='printArea'; document.body.appendChild(el);}
    {const ps=document.getElementById('pageSize'); if(ps)ps.textContent='';}
    el.className='print-'+pState.fmt; el.innerHTML=cardsHtml();
    el.classList.add('measuring'); try{fitCards(el);}catch(e){} el.classList.remove('measuring');
    document.body.classList.add('printing');
    const done=()=>{document.body.classList.remove('printing'); window.removeEventListener('afterprint',done);};
    window.addEventListener('afterprint',done);
    try{window.print();}catch(e){}
    setTimeout(()=>{if(document.body.classList.contains('printing')&&!window.matchMedia('print').matches){toast(DEMO?'範例頁面不能列印，請在正式版的手機或電腦上列印':'若沒有出現列印視窗，請用瀏覽器選單的「列印」');}},1500);
  }

  // related items = items matching the need's rule + items linked by hand
  function related(nd){
    const auto=nd.re?S.items.filter(it=>(!nd.cat||it.cat===nd.cat)&&nd.re.test(it.name)):[];
    const extra=[...(S.links[nd.key]||[])].map(id=>S.items.find(x=>x.id===id)).filter(Boolean);
    const seen=new Set(), out=[];
    auto.forEach(it=>{if(!seen.has(it.id)){seen.add(it.id);out.push({it,auto:true});}});
    extra.forEach(it=>{if(!seen.has(it.id)){seen.add(it.id);out.push({it,auto:false});}});
    return out;
  }
  function progress(nd){
    const d=S.details[nd.key]; if(!d||!(d.target>0))return null;
    const cur=d.mode==='auto'?related(nd).filter(r=>live(r.it)).reduce((a,r)=>a+r.it.qty,0):(Number(d.current)||0);
    return {cur,target:d.target,unit:d.unit||'',pct:Math.min(100,Math.round(cur/d.target*100))};
  }
  const nfmt=n=>Number(n).toLocaleString('zh-TW');
  function needState(sc,nd){
    const p=progress(nd);
    if(p)return {ok:p.cur>=p.target,note:`${nfmt(p.cur)} / ${nfmt(p.target)} ${p.unit}・${p.pct}%`,prog:p};
    if(nd.manual){const ok=!!S.checks[nd.key]; return {ok,note:ok?'已確認':'尚未確認'};}
    return nd.test();
  }
  function readiness(sc){const r=sc.needs.map(nd=>needState(sc,nd)); return {ok:r.filter(x=>x.ok).length,total:r.length};}
  const PLAN_F=[['meet1','第一集合點'],['wait1','在第一集合點等'],['meet2','第二集合點'],['final','最終目標']];
  function planReady(){const k=['meet1','meet2','final','phone'];return {ok:k.filter(x=>S.plan[x]).length,total:k.length};}
  function planRoute(){
    const stop=(v,lab,extra)=>v?`<span class="stop">${esc(v)}${extra?`<small>${esc(extra)}</small>`:''}</span>`:`<span class="stop empty">${lab}未填</span>`;
    return `<div class="plan-route">${stop(S.plan.meet1,'第一集合點',S.plan.wait1?'等 '+S.plan.wait1:'')}<span class="arr">→</span>${stop(S.plan.meet2,'第二集合點')}<span class="arr">→</span>${stop(S.plan.final,'最終目標')}</div>`;
  }

        return `<button class="scen" data-act="scen" data-id="${sc.id}"><span><b>${esc(sc.title)}</b><small>${esc(sc.sum)}</small></span><span class="rd ${r.total&&r.ok===r.total?'ok':'miss'}">${r.ok}/${r.total}</span></button>`;}).join('')||'<div class="cat-empty">這組沒有情境</div>'}</div>`).join('')}

      <p class="src">內容為一般原則，不能取代醫療專業判斷與官方指示。每個情境都可以按鉛筆改成你們家的版本。</p>`;
  }
  function splitBag(m){
    const own=S.items.filter(it=>it.owner===m.id&&it.qty>0), keep=[], give=[];
    const keepSubs=['求救','照明','保暖','外傷','衛材','常備藥','安撫','寢具','外套','保暖衣'];
    own.forEach(it=>{
      if(it.cat==='食'&&it.sub==='飲用水'){const k=Math.min(it.qty,Math.ceil(m.water/it.unitL)); if(k)keep.push([it,k]); if(it.qty>k)give.push([it,it.qty-k]);}
      else if(isFood(it)){const k=Math.min(it.qty,m.meals); keep.push([it,k]); if(it.qty>k)give.push([it,it.qty-k]);}
      else if(keepSubs.includes(it.sub)||it.cat==='醫藥')keep.push([it,it.qty]);
      else give.push([it,it.qty]);
    });
    return {own,keep,give};
  }
  const findNeed=(scId,i)=>SCEN.find(s=>s.id===scId).needs[Number(i)];
  function progBar(p,ok){
    return `<span class="pb ${ok?'done':''}" role="img" aria-label="${p.pct}%">
      <span class="pb-meta"><span class="pb-num">${nfmt(p.cur)}<small> / ${nfmt(p.target)} ${esc(p.unit)}</small></span><b>${ok?'✓ 達標':p.pct+'%'}</b></span>
      <span class="pb-track"><span class="pb-fill" style="--p:${p.pct}%"></span><i style="left:25%"></i><i style="left:50%"></i><i style="left:75%"></i></span></span>`;
  }
  function needRow(sc,nd,i,wn){
    const st=needState(sc,nd), open=S.openNeeds.has(sc.id+':'+i), lab=labOf(nd), ro=S.offline;
    const icon=nd.manual&&!st.prog
      ?`<input type="checkbox" data-act="mchk" data-key="${nd.key}" data-scen="${sc.id}" ${st.ok?'checked':''} ${ro?'disabled':''} aria-label="${esc(lab)}">`

    let body='';
    {
      const rel=related(nd), d=S.details[nd.key]||{};
      body=`<div class="nd-wrap" ${open?'':'inert'}><div class="nd-in"><div class="nd-body">
        <div class="nd-sec"><span class="lab">相關品項</span>
          ${rel.length?`<ul class="rel">${rel.map(({it,auto})=>`<li><button data-act="nitem" data-id="${it.id}" data-scen="${sc.id}"><span class="t">${esc(it.name)}${auto?'':'<span class="shared">手動</span>'}</span><span class="m">${ICON.pin}${esc(locLabel(it.loc))}</span></button><span class="q">${isWater(it)?r1(it.qty*it.unitL)+' L':it.qty+' '+esc(it.unit)}</span>${['exp','3','chk'].includes(tierOf(it))?tierChip(it):''}</li>`).join('')}</ul>`
            :'<div class="cat-empty">還沒有相關品項</div>'}</div>
        ${d.note?`<div class="nd-sec"><span class="lab">處理細節</span><div class="nd-note">${esc(d.note)}</div></div>`:''}
        <div class="nd-acts">
          ${!st.ok&&nd.buy?(wn.has(nd.buy.name)?'<span class="inwish">已在待購</span>':`<button class="btn sm" data-act="nbuy" data-scen="${sc.id}" data-i="${i}" ${ro?'disabled':''}>＋ 待購</button>`):''}
          <button class="btn sm" data-act="nlink" data-scen="${sc.id}" data-i="${i}" ${ro?'disabled':''}>連結品項</button>
          <button class="btn sm" data-act="nedit" data-scen="${sc.id}" data-i="${i}" ${ro?'disabled':''}>${ICON.pencil} 細節與目標</button>
        </div></div></div></div>`;

    return `<li class="${open?'open':''}">${icon}<div>${head}${body}</div></li>`;
  }
  function openScen(id,keep){
    const sc=SCEN.find(s=>s.id===id); if(!sc)return;
    S.ret=id;

        <div class="pick">${S.members.map(x=>`<button data-act="inj" data-id="${x.id}" class="${x.id===m.id?'on':''}">${esc(x.name)}</button>`).join('')}</div>

          :`<div class="empty">${esc(m.name)}沒有個人避難包物品，從全家共用物資分配。</div>`}</div>`;

    openSheet(`<h2>${esc(sc.title)}</h2><div class="sub">${esc(sc.sum)}</div>
      ${extra}
      <div class="blk"><div class="blk-h"><h3>怎麼做</h3><button class="btn sm" data-act="sedit" data-id="${sc.id}" ${S.offline?'disabled':''}>${ICON.pencil} 編輯情境</button></div>

        <ul class="needs">${sc.needs.map((nd,i)=>needRow(sc,nd,i,wn)).join('')}</ul></div>
      ${sc.src?`<div class="src">${sc.src}</div>`:''}
      <div class="sheet-actions"><span></span><button class="btn primary" data-act="close">關閉</button></div>`,sc.title,keep);
  }
  let dState=null;
  function openDetail(scId,i){

    const hasRel=related(nd).length>0;
    dState={scId,i,mode:d.mode||(hasRel&&!nd.manual?'auto':'manual'),current:d.current??'',target:d.target??'',unit:d.unit??'',note:d.note??''};

    const nd=findNeed(dState.scId,dState.i), f=dState, hasRel=related(nd).length>0;
    const autoSum=related(nd).filter(r=>live(r.it)).reduce((a,r)=>a+r.it.qty,0);
    openSheet(`<h2>${esc(labOf(nd))}</h2><div class="sub">細節與目標・同一項在其他情境也會顯示</div>
      <div class="field"><span>目前數量怎麼算</span><div class="toggles">
        <button data-act="dmode" data-k="manual" class="${f.mode==='manual'?'on':''}">自己輸入</button>
        <button data-act="dmode" data-k="auto" class="${f.mode==='auto'?'on':''}" ${hasRel?'':'disabled'}>相關品項數量加總${hasRel?`（目前 ${autoSum}）`:''}</button></div></div>
      <div class="grid2">
        ${f.mode==='manual'?`<label class="field"><span>目前準備</span><input id="d-current" data-d="current" type="number" inputmode="numeric" value="${esc(f.current)}" placeholder="例：50000"></label>`:''}
        <label class="field"><span>目標</span><input id="d-target" data-d="target" type="number" inputmode="numeric" value="${esc(f.target)}" placeholder="例：100000"></label>
        <label class="field"><span>單位</span><input id="d-unit" data-d="unit" value="${esc(f.unit)}" placeholder="元、片、天"></label>
      </div>
      <label class="field"><span>處理細節</span><textarea id="d-note" data-d="note" rows="4" placeholder="例：分兩份放，爸爸包與媽媽包各一份，以百元鈔為主">${esc(f.note)}</textarea></label>
      <div class="hint">有填目標時，達到目標才算準備好；目標留空就照原本的規則判斷。</div>
      <div class="sheet-actions"><button class="btn" data-act="scen" data-id="${f.scId}">取消</button><button class="btn primary" data-act="dok">儲存</button></div>`,'細節與目標');

  let lState=null;

    openSheet(`<h2>連結品項</h2><div class="sub">${esc(labOf(nd))}・勾選和這一項有關的庫存</div>
      <input id="l-q" data-l="q" value="${esc(lState.q)}" placeholder="搜尋名稱或位置" style="border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:9px 10px;font-size:15px;width:100%">
      ${CATS.map(c=>{const l=its.filter(it=>it.cat===c); if(!l.length)return '';
        return `<div class="cat-block"><h3>${c}</h3><ul class="alloc">${l.map(it=>{const au=autoIds.has(it.id);
          return `<li><label class="lk"><input type="checkbox" data-act="ltog" data-id="${it.id}" ${au||lState.sel.has(it.id)?'checked':''} ${au?'disabled':''}> ${esc(it.name)}${au?'<span class="shared">自動</span>':''}</label><span class="q">${it.qty}<small>${esc(it.unit)}</small></span></li>`;}).join('')}</ul></div>`;}).join('')||'<div class="empty">找不到符合的品項</div>'}
      <div class="sheet-actions"><button class="btn" data-act="scen" data-id="${lState.scId}">取消</button><button class="btn primary" data-act="lok">儲存</button></div>`,'連結品項');

  function openPlan(){

      ${PLAN_F.map(([k,l])=>`<label class="field"><span>${l}</span><input id="p-${k}" data-pf="${k}" value="${esc(S.plan[k])}" placeholder="${{meet1:'例：住家附近的國小操場',wait1:'例：1 小時',meet2:'例：區公所前廣場',final:'例：外縣市親友家',contact:'例：外縣市親友的電話'}[k]}"></label>`).join('')}
      <div class="sheet-actions"><button class="btn" data-act="${S.ret?'scen':'close'}" data-id="${S.ret||''}">取消</button><button class="btn primary" data-act="pok">儲存</button></div>`,'我們的計畫');

  // ================= data layer (Google 試算表) =================
  const DEMO=!CONFIG.API;
  const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  S.role=DEMO?'editor':'viewer'; S.online=true; S.thumbs={}; S.lastSync=0;
  const fullCache={}, pendingThumb={};
  const psrc=p=>!p?'':p.startsWith('data:')?(pendingThumb[p]||p):(S.thumbs[p]||'');
  function pfull(p){
    if(!p)return ''; if(p.startsWith('data:'))return p;
    if(fullCache[p])return fullCache[p];
    if(!DEMO)loadFull(p);
    return S.thumbs[p]||'';
  }
  async function loadFull(id){
    try{
      let d=await idb.get('full_'+id).catch(()=>null);
      if(!d&&S.online){d=(await api('photo',{id})).data; idb.set('full_'+id,d).catch(()=>{});}
      if(!d)return; fullCache[id]=d;
      document.querySelectorAll(`img[data-pid="${id}"]`).forEach(im=>im.src=d);
    }catch(e){}
  }
  function resizeImg(file,max,q){return new Promise((res,rej)=>{const img=new Image(), url=URL.createObjectURL(file);
    img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height)), c=document.createElement('canvas');
      c.width=Math.round(img.width*k); c.height=Math.round(img.height*k); c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg',q));};
    img.onerror=()=>{URL.revokeObjectURL(url); rej(new Error('讀不到這張照片'));}; img.src=url;});}

  const idb=(()=>{let p;
    const db=()=>p||(p=new Promise((res,rej)=>{const r=indexedDB.open('family-prep',1); r.onupgradeneeded=()=>r.result.createObjectStore('kv'); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);}));
    const tx=(mode,fn)=>db().then(d=>new Promise((res,rej)=>{const t=d.transaction('kv',mode), q=fn(t.objectStore('kv')); t.oncomplete=()=>res(q&&q.result); t.onerror=()=>rej(t.error);}));
    return {get:k=>tx('readonly',s=>s.get(k)), set:(k,v)=>tx('readwrite',s=>s.put(v,k)), clear:()=>tx('readwrite',s=>s.clear())};})();

  // ---- session ----
  let sess=null;
  const readSession=()=>{try{return JSON.parse(localStorage.getItem('fp-session')||sessionStorage.getItem('fp-session')||'null');}catch(e){return null;}};
  const saveSession=(s,remember)=>{s.remember=!!remember; sess=s; try{(remember?localStorage:sessionStorage).setItem('fp-session',JSON.stringify(s));}catch(e){}};
  const clearSession=()=>{sess=null; try{localStorage.removeItem('fp-session');sessionStorage.removeItem('fp-session');}catch(e){}};

  async function api(action,data={}){
    let res;
    try{res=await fetch(CONFIG.API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,session:sess&&sess.session,...data})});}
    catch(e){const er=new Error('連不上伺服器'); er.code='NET'; throw er;}
    let j; try{j=await res.json();}catch(e){const er=new Error('伺服器回應格式錯誤'); er.code='NET'; throw er;}
    if(!j.ok){const er=new Error(j.message||j.error||'發生錯誤'); er.code=j.error; throw er;}
    return j;
  }

  // ---- tables <-> state ----
  const ITEM_COLS=['id','cat','sub','name','qty','unit','unitL','kcal','prep','method','suits','owner','loc','exp','checked','size','needType','need','mah','battery','photos','flavors'];
  const strRow=r=>Object.fromEntries(Object.entries(r).map(([k,v])=>[k,v==null?'':String(v)]));
  function toTables(){
    const keys=new Set([...Object.keys(S.details),...Object.keys(S.links),...Object.keys(S.checks).filter(k=>S.checks[k])]);
    const t={
      Members:S.members.map(m=>({id:m.id,role:roleOf(m),name:m.name,birth:m.birth||'',water:m.water,meals:m.meals,kcal:m.kcal,fullName:m.fullName||'',blood:m.blood||'',idno:m.idno||'',phone:m.phone||'',allergy:m.allergy||'',school:m.school||'',pickup:m.pickup||'',photo:m.photo||''})),

      Items:S.items.map(it=>{const o={}; ITEM_COLS.forEach(k=>o[k]=it[k]); o.suits=(it.suits||[]).join(','); o.photos=(it.photos||[]).join(','); o.flavors=hasFl(it)?JSON.stringify(it.flavors):''; return o;}),
      Usage:S.log.map(l=>({id:l.id,time:l.t,itemId:l.itemId||'',name:l.name,qty:l.n,unit:l.unit,by:l.by||''})),
      Wishlist:S.wants.map(w=>({id:w.id,cat:w.cat,name:w.name,qty:w.qty,unit:w.unit,note:w.note||'',budget:w.budget??''})),
      Needs:[...keys].map(k=>{const d=S.details[k]||{}; return {id:k,mode:d.mode||'',current:d.current,target:d.target,unit:d.unit||'',note:d.note||'',links:[...(S.links[k]||[])].join(','),checked:S.checks[k]?'TRUE':''};}),
      Scenarios:SCEN.filter(s=>s.edited).map(s=>({id:s.id,steps:s.steps.join('\n'),group:s.g,title:s.title,sum:s.sum||'',needs:JSON.stringify(s.needs.map(needSpec))})),
      Plan:Object.entries(S.plan).map(([k,v])=>({id:k,value:v})),
      Settings:[{id:'hyg',value:S.hyg},{id:'goBag',value:S.goBag},{id:'scenOrder',value:S.scenOrderTouched?SCEN.map(x=>x.id).join(','):(S.scenOrderRaw||'')},{id:'scenHidden',value:[...S.scenHidden].join(',')},{id:'locs',value:JSON.stringify(S.locs)}]
    };
    Object.keys(t).forEach(n=>t[n]=t[n].map(strRow));

      case 'ctok': {const f=ctState; if(!f.name.trim()){toast('請填姓名');break;}
        const rec={id:f.id,name:f.name.trim(),kin:f.kin||'',relation:f.kin?kinLabel({kin:f.kin},selfM()):f.relation.trim(),phone:f.phone.trim(),note:f.note.trim(),onCard:!!f.onCard};
        if(f.isNew)S.contacts.push(rec); else Object.assign(S.contacts.find(c=>c.id===f.id),rec);
        closeSheet(); render(); toast('已儲存'); break;}
      case 'cdel': {if(!ctState.delArm){ctState.delArm=true; drawContact(); break;} S.contacts=S.contacts.filter(c=>c.id!==ctState.id); closeSheet(); render(); toast('已刪除'); break;}
      case 'wall': openWallpapers(); break;
      case 'wgen': genWallpaper(b.dataset.id); break;
      case 'wshare': {const f=document.getElementById('wallOut')._file; if(f&&navigator.share)navigator.share({files:[f]}).catch(()=>{}); break;}
      case 'cards': openCards(); break;
      case 'pfmt': pState.fmt=b.dataset.k; drawCards(); break;
      case 'psel': {const id=b.dataset.id; pState.sel.has(id)?pState.sel.delete(id):pState.sel.add(id); drawCards(); break;}
      case 'pgo': doPrint(); break;
      case 'plan': openPlan(); break;
      case 'pok': {PLAN_F.forEach(([k])=>{S.plan[k]=document.getElementById('p-'+k).value.trim();}); render(); if(S.ret)openScen(S.ret); else closeSheet(); toast('計畫已儲存'); break;}
      case 'edit': openForm(b.dataset.id); break;
      case 'checked': {const it=S.items.find(x=>x.id===b.dataset.id); it.checked=fmt(today); if(it.battery!=null&&it.battery!=='')it.battery=100; render(); openItem(it.id,true); toast(it.battery===100?`已紀錄「${it.name}」充飽電`:`已標記「${it.name}」今天檢查過`); break;}
      case 'consume': cState={id:b.dataset.id,n:1}; drawConsume(); break;
      case 'cfl': cState.fl=Number(b.dataset.i); cState.n=1; drawConsume(); break;
      case 'cn': {const it=S.items.find(x=>x.id===cState.id), max=hasFl(it)?it.flavors[cState.fl].q:it.qty; cState.n=Math.max(1,Math.min(max,cState.n+Number(b.dataset.d))); drawConsume(); break;}
      case 'cok': {const it=S.items.find(x=>x.id===cState.id); let lname=it.name;
        if(hasFl(it)){const x=it.flavors[cState.fl]; x.q=Math.max(0,x.q-cState.n); it.qty=flSum(it.flavors); lname=`${it.name}（${x.n}）`;} else it.qty-=cState.n;
        const now=new Date(); S.log.unshift({id:uid('U'),t:`${fmt(now)} ${pad(now.getHours())}:${pad(now.getMinutes())}`,itemId:it.id,name:lname,n:cState.n,unit:it.unit,by:sess?sess.name:''});
        render(); openItem(it.id,true); toast(`已扣除：${it.name} −${cState.n} ${it.unit}`); break;}
      case 'fs': {const k=b.dataset.k,s=fState.suits; fState.suits=s.includes(k)?s.filter(x=>x!==k):s.concat(k); drawForm(); break;}
      case 'fdel': {if(!fState.delArm){fState.delArm=true; drawForm(); break;}
        const it=S.items.find(x=>x.id===fState.id); S.items=S.items.filter(x=>x.id!==fState.id);
        Object.values(S.links).forEach(set=>set.delete(fState.id)); closeSheet(); render(); toast(`已刪除「${it.name}」`); break;}
      case 'fladd': {if(!fState.flavors)fState.flavors=[]; if(!fState.flavors.length&&Number(fState.qty)>0)fState.flavors.push({n:'',q:Number(fState.qty)}); else fState.flavors.push({n:'',q:''}); drawForm(); const el=document.getElementById('fl-n-'+(fState.flavors.length-1)); if(el)el.focus(); break;}
      case 'fldel': {fState.flavors.splice(Number(b.dataset.i),1); if(!fState.flavors.length)fState.qty=fState.qty; drawForm(); break;}
      case 'fn': fState.needType=b.dataset.k; if(!fState.needType)fState.need=''; drawForm(); break;
      case 'fcrop': {const i=Number(b.dataset.i), st=fState; (async()=>{const src=await photoData(st.photos[i]); if(!src){toast('照片還沒載入，請連上網路後再試');return;} const r=await cropImage(src,ITEM_RATIO,'重新裁切'); if(!r)return; pendingThumb[r.full]=r.thumb; st.photos[i]=r.full; if(fState===st)drawForm();})(); break;}
      case 'mcrop': {const st=mState; (async()=>{const src=await photoData(st.photo); if(!src){toast('照片還沒載入，請連上網路後再試');return;} const r=await cropImage(src,MEM_RATIO,'重新裁切'); if(!r)return; pendingThumb[r.full]=r.thumb; st.photo=r.full; if(mState===st)drawMember();})(); break;}
      case 'ctfold': S.ctOpen=!S.ctOpen; renderResp(); break;
      case 'locfold': {const id=b.dataset.id; S.locOpen.has(id)?S.locOpen.delete(id):S.locOpen.add(id); renderStock(); break;}
      case 'locedit': openLocEdit(); break;
      case 'lcadd': lcState.push({id:uid('L'),name:'',kids:[]}); drawLocEdit(); break;
      case 'lcadk': lcState[Number(b.dataset.t)].kids.push({id:uid('L'),name:''}); drawLocEdit(); break;
      case 'lcmv': {const t=Number(b.dataset.t), k=b.dataset.k, d=Number(b.dataset.d); const arr=k==null?lcState:lcState[t].kids, i=k==null?t:Number(k), j=i+d; if(j<0||j>=arr.length)break; [arr[i],arr[j]]=[arr[j],arr[i]]; drawLocEdit(); break;}
      case 'lcdel': {const t=Number(b.dataset.t), k=b.dataset.k; if(k==null)lcState.splice(t,1); else lcState[t].kids.splice(Number(k),1); drawLocEdit(); break;}
      case 'lcok': saveLocEdit(); break;
      case 'invout': openInvOut(b.dataset.id); break;
      case 'ifmt': ioState.fmt=b.dataset.k; drawInvOut(); break;
      case 'iprint': printInv(); break;
      case 'iimg': genInvImage(); break;
      case 'fcover': {const i=Number(b.dataset.i); const [p]=fState.photos.splice(i,1); fState.photos.unshift(p); drawForm(); break;}
      case 'frm': fState.photos.splice(Number(b.dataset.i),1); drawForm(); break;
      case 'fok': {
        const f=fState, cfg=CFG[f.cat], food=f.cat==='食', water=food&&(f.sub==='飲用水'||f.sub==='生活用水');
        if(!f.name.trim()){toast('請填名稱');document.getElementById('f-name').focus();break;}
        if(water&&!(Number(f.unitL)>0)){toast('請填每單位容量（公升）');break;}
        if(food&&!water&&!f.suits.length){toast('請至少選一個適合對象');break;}
        if(cfg.expReq&&!f.exp&&f.sub!=='生活用水'){toast('請填有效日');break;}
        if(f.needType&&!(Number(f.need)>0)){toast('請填需求數量');break;}
        const num=v=>v===''||v==null?'':Number(v);
        if(Array.isArray(f.flavors)){f.flavors=f.flavors.map(x=>({n:String(x.n||'').trim(),q:Math.max(0,Math.round(Number(x.q)||0))})).filter(x=>x.n); if(!food||water)f.flavors=[]; if(f.flavors.length)f.qty=flSum(f.flavors);}
        const clean={...f,qty:Number(f.qty)||0,kcal:Number(f.kcal)||0,prep:Number(f.prep)||0,unitL:Number(f.unitL)||0,need:num(f.need),mah:num(f.mah),battery:num(f.battery),loc:f.loc||''};
        if(!clean.mah)delete clean.mah; if(clean.battery==='')delete clean.battery; if(!clean.needType){delete clean.needType;delete clean.need;}
        if(water)clean.suits=f.sub==='生活用水'?[]:['成人','兒童','幼兒'];
        if(f.id){const i=S.items.findIndex(x=>x.id===f.id); S.items[i]=clean; render(); openItem(f.id); toast('已儲存');}
        else{clean.id=uid('I'); const fw=clean.fromWant; delete clean.fromWant; S.items.push(clean);
          if(fw){S.wants=S.wants.filter(w=>w.id!==fw); closeSheet(); render(); toast(`「${clean.name}」已移進「${clean.cat}」`);}
          else{closeSheet(); render(); toast(`已新增「${clean.name}」`);}}
        break;}
      case 'ms': {const id=b.dataset.id,k=b.dataset.k,d=Number(b.dataset.d);
        if(id==='_'){ if(k==='hyg')S.hyg=Math.max(0,r1(S.hyg+d)); else S.goBag=Math.max(1,S.goBag+d); }
        else{const m=mem(id); const min={water:0,meals:1,kcal:500}[k]; m[k]=Math.max(min,r1(m[k]+d));}
        openSettings(); renderDays(); renderRail(); break;}
      case 'acct': openAccount(); break;
      case 'logout': logout(); break;
      case 'resync': closeSheet(); refresh(); break;
      case 'offlineView': hideLogin(); S.role='viewer'; S.online=false; applyMode(); render(); break;
    }
    if(!DEMO&&sess&&S.role==='editor'&&synced&&diff().n)scheduleSync();
  });
  const _once={};
  function confirmOnce(k){if(_once[k])return true; _once[k]=true; toast('身分證字號格式看起來不對，確認無誤再按一次儲存'); return false;}
  document.addEventListener('input',e=>{
    const t=e.target;
    if(t.dataset.lct!=null&&lcState){const o=t.dataset.lck!=null?lcState[Number(t.dataset.lct)].kids[Number(t.dataset.lck)]:lcState[Number(t.dataset.lct)]; o.name=t.value; return;}
    if(t.dataset.locset){const it=S.items.find(x=>x.id===t.dataset.locset); if(it){it.loc=t.value; renderStock(); toast('已指定：'+locLabel(it.loc)); if(!DEMO&&sess&&S.role==='editor'&&synced&&diff().n)scheduleSync();} return;}
    if(t.dataset.e&&eState){eState[t.dataset.e]=t.value; return;}
    if(t.dataset.en!=null&&eState){eState.needs[Number(t.dataset.en)].l=t.value; return;}
    if(t.dataset.m&&mState){mState[t.dataset.m]=t.value; if(t.dataset.m==='role')drawMember(); return;}
    if(t.dataset.c&&ctState){ctState[t.dataset.c]=t.type==='checkbox'?t.checked:t.value; if(t.dataset.c==='kin')drawContact(); return;}
    if(e.target.dataset.d&&dState){dState[e.target.dataset.d]=e.target.value;return;}
    if(e.target.dataset.l&&lState){lState.q=e.target.value; drawLink(); const el=document.getElementById('l-q'); el.focus(); el.setSelectionRange(el.value.length,el.value.length); return;}
    if(t.dataset.fl!=null&&fState&&fState.flavors){const x=fState.flavors[Number(t.dataset.fl)]; x[t.dataset.k]=t.value; const q=document.getElementById('f-qty'); if(q&&q.disabled)q.value=flSum(fState.flavors); return;}
    const k=e.target.dataset.f; if(!k||!fState)return;
    fState[k]=e.target.value;
    if(k==='sub'){ if(fState.cat==='食'&&(fState.sub==='飲用水'||fState.sub==='生活用水')){fState.unit=fState.unit==='包'?'瓶':fState.unit;} drawForm(); return; }
    if(k==='prep'||k==='kcal'){const el=document.getElementById('f-ratio'); const p=Number(fState.prep),kc=Number(fState.kcal);
      if(el){ if(p>0&&kc>0){el.hidden=false;el.textContent=`每 100 ml 水換 ${Math.round(kc/p*100)} kcal`;} else el.hidden=true; }}
  });
  document.addEventListener('change',e=>{
    if(e.target.dataset.c==='onCard'&&ctState){ctState.onCard=e.target.checked; return;}
    if(e.target.dataset.mphoto&&e.target.files.length&&mState){const st=mState, file=e.target.files[0]; e.target.value=''; (async()=>{try{const raw=await resizeImg(file,2000,.9), r=await cropImage(raw,MEM_RATIO,'家人照片'); if(!r)return; pendingThumb[r.full]=r.thumb; st.photo=r.full; if(mState===st)drawMember();}catch(err){toast(err.message);}})(); return;}
    if(!e.target.dataset.fphoto||!e.target.files.length||!fState)return;
    const files=[...e.target.files], st=fState;
    (async()=>{let ok=0;
      e.target.value='';
      for(let i=0;i<files.length;i++){const f=files[i]; try{const raw=await resizeImg(f,2000,.9), r=await cropImage(raw,ITEM_RATIO,files.length>1?`品項照片 ${i+1}/${files.length}`:'品項照片',true); const out=r||{full:await resizeImg(f,1600,.82),thumb:await resizeImg(f,240,.65)}; pendingThumb[out.full]=out.thumb; st.photos.push(out.full); ok++;}catch(err){toast(err.message);}}
      if(fState===st){drawForm(); toast(`已加入 ${ok} 張，按儲存後上傳`);}})();
  });
  document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();});
  document.getElementById('offlineToggle').addEventListener('change',e=>{
    S.offline=e.target.checked; document.body.classList.toggle('offline',S.offline);
    document.getElementById('syncPill').textContent=S.offline?`離線中・資料停在 ${fmt(today).slice(5)} 13:40`:'已同步・今天 13:40';
    render();
  });

  boot();
})();
</script>

<script>
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}
</script>
